# Tag ref-dependent outputs (cell2location, label transfer, loupe CSV). Change this when
# testing a new reference so results for the same spatial label do not overwrite each other.
# Example target: for_loupe/spatial_{label}_compv1_mmv2_for_loupe.csv
ref_tag:  "compv1_mmv2"    #v2 refers to older reference (avoids putting ref_tag in name)  "compv1_mmv2"  refers to newer ref

# Cellestimate (CellTypeEstimate)
cellestimate_script: "/research/groups/mackgrp/home/demerson/CellTypeEstimate/cte4so.R"
cellestimate_db: "Yao_et_al_mouse_format_addendum"
cellestimate_cf: "Yao_et_al_mouse_format"

# Marker atlas for assemble_loupe tlscore / NNLS (Allen atlas Excel).
# Update alongside ref_tag when switching scRNA reference context.
#
# compv1_mmv2 (current):
marker_excel: "/research/groups/mackgrp/home/demerson/CellTypeEstimate/db/mm.brain.v2.xlsx"
marker_sheet: "Sheet1"
marker_cluster_col: "geneSymbolmore1"
marker_class_col: "Class"
